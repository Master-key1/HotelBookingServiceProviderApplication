<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaction Log Viewer</title>

    <!-- Bootstrap CSS (CDN) -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .card-custom {
            width: 100%;
            max-width: 450px;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.97);
            color: #e5e7eb;
            backdrop-filter: blur(10px);
        }

        .card-custom .card-header {
            border-bottom: none;
            padding-bottom: 0;
        }

        .glow-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 15px #22c55e;
            display: inline-block;
            margin-right: 8px;
        }

        .form-control,
        .form-control:focus {
            background-color: #020617;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.5);
            color: #e5e7eb;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .btn-primary {
            border-radius: 999px;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca, #0891b2);
        }

        .hint-text {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .badge-env {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 999px;
            padding: 0.2rem 0.6rem;
            background: rgba(56, 189, 248, 0.1);
            color: #7dd3fc;
        }

        .result-box {
            border-radius: 12px;
            border: 1px dashed rgba(148, 163, 184, 0.5);
            padding: 0.75rem 0.9rem;
            font-size: 0.8rem;
            max-height: 160px;
            overflow-y: auto;
            background: #020617;
            margin-top: 0.75rem;
            color: #9ca3af;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>

<div class="card card-custom">
    <div class="card-header px-4 pt-4">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <span class="glow-dot"></span>
                <span class="fw-semibold">Transaction Log Viewer</span>
                <div class="small text-muted mt-1">
                    Enter a Txn ID to fetch and view its logs.
                </div>
            </div>
            <span class="badge-env">SGND/QA42/UAT42</span>
        </div>
    </div>

    <div class="card-body px-4 pb-4 pt-3">
        <!-- Form -->
		<form onsubmit="goToLog(event)" class="mt-3">

		    <div class="mb-3">
		        <label for="txnId">Transaction ID</label>
		        <input type="text"
		               id="txnId"
		               class="form-control"
		               placeholder="Provide 18 digit txn id"
		               required/>
		    </div>

		    <button type="submit" class="btn btn-success">Get Log (Path)</button>
		</form>

		<script>
		function goToLog(event) {
		    event.preventDefault();
		    const txnId = document.getElementById("txnId").value;
		    window.location.href = "/txn/log/" + txnId;
		}
		</script>

        <!-- Optional: Display Result (Thymeleaf binding) -->
        <div th:if="${log != null}" class="mt-4">
            <div class="result-label">Log Output</div>
            <div class="result-box" th:text="${log}"></div>
        </div>

        <div th:if="${error != null}" class="mt-3 text-danger small">
            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="${error}"></span>
        </div>
    </div>
</div>

<!-- Optional: Bootstrap JS (if needed) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
