spring:
  application:
    name: HotelBookingServiceProvider
  datasource:
    url: jdbc:h2:mem:hotel_db
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
